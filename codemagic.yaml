workflows:
  ios-release:
    name: PixReveal iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_credentials
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cytbilisim.pixreveal
      vars:
        APP_STORE_APP_ID: 6784971749
        BUNDLE_ID: com.cytbilisim.pixreveal
      flutter: stable
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files com.cytbilisim.pixreveal \
            --type IOS_APP_STORE \
            --create

      - name: Set up keychain and certificates
        script: |
          keychain initialize
          keychain add-certificates

      - name: Set up code signing settings
        script: |
          cd mobile
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Generate iOS config
        script: |
          cd mobile
          flutter build ios --config-only

      - name: Pod install
        script: |
          cd mobile/ios
          pod install --repo-update

      - name: Set up code signing (after pods)
        script: |
          cd mobile
          xcode-project use-profiles

      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          cd mobile/ios
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - info@cytbilisim.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
