workflows:
  ios-release:
    name: PixReveal iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_credentials
    environment:
      groups:
        - signing
      vars:
        APP_STORE_APP_ID: 6784971749
      flutter: stable
      xcode: 26
      cocoapods: default
    triggering:
      cancel_previous_builds: false
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 -D > /tmp/dist_cert.p12
          keychain add-certificates --certificate /tmp/dist_cert.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Set up provisioning profile
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo $CM_PROVISIONING_PROFILE | base64 -D > "$PROFILES_DIR/PixReveal.mobileprovision"
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Generate iOS config
        script: |
          cd mobile
          flutter build ios --config-only

      - name: Pod install
        script: |
          cd mobile/ios
          pod install --repo-update

      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          cd mobile/ios
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Pre-build signing check
        script: |
          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning
          echo "=== PROVISIONING PROFILES ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "EMPTY"
          echo "=== XCODE SIGNING SETTINGS ==="
          grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM" mobile/ios/Runner.xcodeproj/project.pbxproj | grep -v "^\s*//" | head -20

      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release --export-options-plist ios/ExportOptions.plist 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — LAST 300 LINES ==="
            tail -300 /tmp/flutter_build.log
            echo "=== XCODEBUILD LOG ==="
            find /tmp/xcodebuild_logs -name "*.log" 2>/dev/null | head -1 | xargs tail -200 2>/dev/null || true
          fi
          exit $BUILD_EXIT

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/flutter_build.log

    publishing:
      email:
        recipients:
          - ickmk1@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
