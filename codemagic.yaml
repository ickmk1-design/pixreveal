workflows:
  ios-release:
    name: PixReveal iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_credentials
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cytbilisim.pixreveal
      vars:
        APP_STORE_APP_ID: 6784971749
        BUNDLE_ID: com.cytbilisim.pixreveal
      flutter: stable
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Fetch signing files (verbose debug)
        script: |
          echo "=== Bundle IDs ==="
          app-store-connect bundle-ids list \
            --bundle-id-identifier com.cytbilisim.pixreveal || true

          echo "=== Distribution Certificates ==="
          app-store-connect certificates list \
            --certificate-type DISTRIBUTION || true

          echo "=== Existing Profiles ==="
          app-store-connect profiles list \
            --bundle-id-identifier com.cytbilisim.pixreveal || true

          echo "=== Fetch + Create ==="
          app-store-connect fetch-signing-files com.cytbilisim.pixreveal \
            --type IOS_APP_STORE \
            --create \
            --verbose

          echo "=== Downloaded profiles ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "PROFILE KLASORU YOK"

          echo "=== Keychain certs ==="
          keychain initialize
          keychain add-certificates
          keychain list-certificates || true

      - name: Set up code signing settings
        script: |
          cd mobile
          xcode-project use-profiles --verbose

      - name: Inspect Xcode signing config
        script: |
          cd mobile/ios
          echo "=== Runner signing settings ==="
          grep -A2 "CODE_SIGN" Runner.xcodeproj/project.pbxproj | head -40
          echo "=== DEVELOPMENT_TEAM ==="
          grep "DEVELOPMENT_TEAM" Runner.xcodeproj/project.pbxproj | head -10
          echo "=== PROVISIONING ==="
          grep "PROVISIONING_PROFILE" Runner.xcodeproj/project.pbxproj | head -10

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Generate iOS config
        script: |
          cd mobile
          flutter build ios --config-only

      - name: Pod install
        script: |
          cd mobile/ios
          pod install --repo-update

      - name: Set up code signing (after pods)
        script: |
          cd mobile
          xcode-project use-profiles

      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID")
          cd mobile/ios
          agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))

      - name: Build IPA
        script: |
          cd mobile
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      email:
        recipients:
          - info@cytbilisim.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
