workflows:
  ios-release:
    name: PixReveal iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: app_store_credentials
    environment:
      groups:
        - signing
      vars:
        APP_STORE_APP_ID: 6784971749
      flutter: stable
      xcode: 26
      cocoapods: default
    triggering:
      cancel_previous_builds: false
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
          echo $CM_CERTIFICATE | base64 -D > /tmp/dist_cert.p12
          keychain add-certificates --certificate /tmp/dist_cert.p12 --certificate-password "$CM_CERTIFICATE_PASSWORD"

      - name: Set up provisioning profile
        script: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo $CM_PROVISIONING_PROFILE | base64 -D > "$PROFILES_DIR/PixReveal.mobileprovision"
          xcode-project use-profiles

      - name: Get Flutter packages
        script: |
          cd mobile
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Generate iOS config
        script: |
          cd mobile
          flutter build ios --config-only

      - name: Pod install
        script: |
          cd mobile/ios
          pod install --repo-update

      - name: Pre-build signing check
        script: |
          echo "=== CODE SIGNING IDENTITIES ==="
          security find-identity -v -p codesigning
          echo "=== PROVISIONING PROFILES ==="
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles/" || echo "EMPTY"
          echo "=== XCODE SIGNING SETTINGS ==="
          grep -E "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM" mobile/ios/Runner.xcodeproj/project.pbxproj | grep -v "^\s*//" | head -20

      - name: Build IPA
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" 2>/dev/null || echo 0)
          NEXT_BUILD=$(($LATEST + 1))
          echo "TestFlight latest build: $LATEST → using build number: $NEXT_BUILD"
          cd mobile
          flutter build ipa --release \
            --build-number=$NEXT_BUILD \
            --export-options-plist ios/ExportOptions.plist 2>&1 | tee /tmp/flutter_build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "=== BUILD FAILED — LAST 300 LINES ==="
            tail -300 /tmp/flutter_build.log
            echo "=== XCODEBUILD LOG ==="
            find /tmp/xcodebuild_logs -name "*.log" 2>/dev/null | head -1 | xargs tail -200 2>/dev/null || true
          fi
          exit $BUILD_EXIT

    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/flutter_build.log

    publishing:
      email:
        recipients:
          - ickmk1@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  android-release:
    name: PixReveal Android Release
    max_build_duration: 90
    instance_type: mac_mini_m1
    working_directory: mobile
    environment:
      groups:
        - pixreveal_android
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.cytbilisim.pixreveal"
        VERSION_CODE_BASE: "20"

    scripts:
      - name: Install NDK 27.0.12077973
        script: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" 2>&1 | tail -5

      - name: Flutter packages get
        script: flutter packages pub get

      - name: Decode keystore from CM_KEYSTORE_B64
        script: |
          echo "$CM_KEYSTORE_B64" | base64 -d > android/app/upload-key.jks
          xxd -l 4 android/app/upload-key.jks
          keytool -list -keystore android/app/upload-key.jks \
                  -storepass "$CM_KEYSTORE_PASSWORD" 2>&1 | grep -E "^Alias name" || true

      - name: Set versionCode from Codemagic BUILD_NUMBER
        script: |
          # Flutter reads versionCode from pubspec.yaml (after +) OR uses flutter.versionCode
          # in gradle. We set it via --build-number on the flutter build cmd, but also patch
          # pubspec to be safe.
          python3 <<'PY'
          import os, re
          from pathlib import Path
          vc = int(os.environ.get("BUILD_NUMBER","0")) + int(os.environ.get("VERSION_CODE_BASE","20"))
          # Patch pubspec version's build number
          ps = Path("pubspec.yaml"); s = ps.read_text()
          s2, n = re.subn(r"(^version:\s*[\d.]+)\+\d+", rf"\1+{vc}", s, count=1, flags=re.MULTILINE)
          if n == 0: raise SystemExit("no version+N pattern in pubspec.yaml")
          ps.write_text(s2)
          print(re.search(r"^version:.*", s2, re.MULTILINE).group(0))
          PY

      - name: Wire keystore into gradle release signingConfig
        script: |
          python3 <<'PY'
          import re, os
          from pathlib import Path
          bg = Path('android/app/build.gradle.kts')
          s = bg.read_text()
          ksp = os.environ["CM_KEYSTORE_PASSWORD"]
          ka  = os.environ["CM_KEY_ALIAS"]
          kp  = os.environ.get("CM_KEY_PASSWORD","")
          release_block = (
              "\n    signingConfigs {\n"
              "        create(\"release\") {\n"
              "            storeFile = file(\"upload-key.jks\")\n"
              f"            storePassword = \"{ksp}\"\n"
              f"            keyAlias = \"{ka}\"\n"
              f"            keyPassword = \"{kp}\"\n"
              "        }\n"
              "    }\n"
          )
          if "signingConfigs {" not in s:
              s = re.sub(r"(\n\s*buildTypes\s*\{)", release_block + r"\1", s, count=1)
          s = re.sub(
              r'signingConfig\s*=\s*signingConfigs\.getByName\("debug"\)',
              'signingConfig = signingConfigs.getByName("release")',
              s, count=1
          )
          bg.write_text(s)
          print("patched build.gradle.kts")
          PY

      - name: Bump JVM heap
        script: |
          cat >> android/gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
          org.gradle.parallel=true
          org.gradle.caching=true
          android.experimental.lint.abortOnError=false
          EOF

      - name: Build Android AAB
        script: |
          BUILD_NUM=$((BUILD_NUMBER + VERSION_CODE_BASE))
          flutter build appbundle --release --build-number=$BUILD_NUM --verbose 2>&1 | tee /tmp/flutter_build.log
          RC=${PIPESTATUS[0]}
          echo "=== flutter exit: $RC ==="
          # Write log INSIDE working_directory so artifact glob (relative) matches
          cp /tmp/flutter_build.log flutter-build.log || true
          echo "=== last 500 lines ==="
          tail -500 /tmp/flutter_build.log || true
          exit $RC

    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/**/mapping.txt
      - flutter-build.log

    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: false
      email:
        recipients:
          - ickmk1@gmail.com
        notify:
          success: true
          failure: true
