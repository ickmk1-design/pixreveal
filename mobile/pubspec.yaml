name: pixreveal
description: Retro Arcade Puzzle - Qix/Gals Panic style territory capture game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^2.5.0
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^7.0.0
  purchases_ui_flutter: ^7.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_analytics: ^11.0.0
  firebase_messaging: ^15.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  image_cropper: ^7.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.0
  go_router: ^14.0.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.0
  webview_flutter: ^4.10.0
  crypto: ^3.0.0
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/spider_hero.png"
  min_sdk_android: 21
  background_color_ios: "#0A0014"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0014"
  adaptive_icon_foreground: "assets/images/spider_hero.png"

flutter_native_splash:
  color: "#0A0014"
  image: assets/images/spider_hero.png
  android_12:
    image: assets/images/spider_hero.png
    color: "#0A0014"
  ios: true
  android: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/ui/
    - assets/audio/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
