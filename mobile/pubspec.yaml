name: pixreveal
description: Retro Arcade Puzzle - Qix/Gals Panic style territory capture game
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^2.5.0
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^7.0.0
  purchases_ui_flutter: ^7.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_analytics: ^11.0.0
  firebase_messaging: ^15.0.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  image_picker: ^1.1.0
  image_cropper: ^7.1.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  cached_network_image: ^3.4.0
  go_router: ^14.0.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  sign_in_with_apple: ^6.1.0
  google_sign_in: ^6.2.0
  webview_flutter: ^4.10.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
