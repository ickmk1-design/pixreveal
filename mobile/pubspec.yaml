name: pixreveal
description: Retro Arcade Puzzle - Qix/Gals Panic style territory capture game
publish_to: 'none'
version: 1.1.0+27

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flame: ^1.18.0
  flame_audio: ^2.10.0
  flutter_riverpod: ^2.5.0
  google_mobile_ads: ^5.1.0
  purchases_flutter: ^8.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_analytics: ^11.0.0
  firebase_messaging: ^15.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  go_router: ^14.0.0
  flutter_animate: ^4.5.0
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  vibration: ^3.1.8
  app_tracking_transparency: ^2.0.6

dependency_overrides:
  device_info_plus: "10.1.2"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  background_color_ios: "#0A0014"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0014"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

flutter_native_splash:
  color: "#0A0014"
  image: assets/icon/app_icon.png
  android_12:
    image: assets/icon/app_icon.png
    color: "#0A0014"
  ios: true
  android: true
  fullscreen: true

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/ui/
