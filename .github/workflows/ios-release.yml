name: PixReveal iOS Release → TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    env:
      APP_STORE_APP_ID: "6784971749"
      BUNDLE_ID: "com.cytbilisim.pixreveal"
      TEAM_ID: "6DQ86Y62WC"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up keychain
        env:
          CM_CERTIFICATE: ${{ secrets.CM_CERTIFICATE }}
          CM_CERTIFICATE_PASSWORD: ${{ secrets.CM_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PW="$(openssl rand -hex 12)"
          echo "KEYCHAIN_PW=$KEYCHAIN_PW" >> $GITHUB_ENV
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/dist_cert.p12
          security import /tmp/dist_cert.p12 \
            -k build.keychain \
            -P "$CM_CERTIFICATE_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" build.keychain

      - name: Set up provisioning profile
        env:
          CM_PROVISIONING_PROFILE: ${{ secrets.CM_PROVISIONING_PROFILE }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          printf '%s' "$CM_PROVISIONING_PROFILE" | base64 --decode > "$PROFILES_DIR/PixReveal.mobileprovision"

      - name: Flutter pub get
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Flutter iOS config-only
        run: flutter build ios --config-only --release

      - name: CocoaPods install
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Get next build number
        id: build_num
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          pip3 install --user --break-system-packages codemagic-cli-tools 2>/dev/null
          export PATH="$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$HOME/Library/Python/3.11/bin:$PATH"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --key-id "$ASC_KEY_ID" \
            --private-key @env:ASC_PRIVATE_KEY \
            2>/dev/null || echo 0)
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          NEXT=$((LATEST + 1))
          [ "$NEXT" -lt 21 ] && NEXT=21
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "Next build: $NEXT"

      - name: Build IPA
        run: |
          UUID=$(security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/PixReveal.mobileprovision" 2>/dev/null \
            | python3 -c "import sys,plistlib; p=plistlib.loads(sys.stdin.buffer.read()); print(p['UUID'])")
          echo "Profile UUID: $UUID"
          flutter build ios --release --no-codesign \
            --build-number=${{ steps.build_num.outputs.next }} \
            2>&1 | tee "$RUNNER_TEMP/flutter_build.log"
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath /tmp/Runner.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE="$UUID" \
            PROVISIONING_PROFILE_SPECIFIER="PixReveal AppStore CM" \
            DEVELOPMENT_TEAM=6DQ86Y62WC \
            2>&1 | tee -a "$RUNNER_TEMP/flutter_build.log"
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/Runner.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            2>&1 | tee -a "$RUNNER_TEMP/flutter_build.log"
          mv build/ios/ipa/Runner.ipa build/ios/ipa/pixreveal.ipa 2>/dev/null || true
          echo "=== IPA(s) ==="
          ls -la build/ios/ipa/

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: mobile/build/ios/ipa/pixreveal.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/flutter_build.log
          if-no-files-found: ignore
