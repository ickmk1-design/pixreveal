name: PixReveal iOS Release → TestFlight

on:
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile

    env:
      APP_STORE_APP_ID: "6784971749"
      BUNDLE_ID: "com.cytbilisim.pixreveal"
      PROFILE_NAME: "PixReveal AppStore CM"
      TEAM_ID: "6DQ86Y62WC"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show tool versions
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Import signing certificate into keychain
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist_cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist_cert.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Prepend our keychain to the search list so codesign finds it
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN"
          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILES_DIR/PixReveal.mobileprovision"
          ls -la "$PROFILES_DIR"

      - name: Install App Store Connect API key
        env:
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # altool + codemagic-cli-tools search these paths:
          mkdir -p "$HOME/.appstoreconnect/private_keys" "$HOME/private_keys"
          printf '%s' "$API_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          cp "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Install codemagic-cli-tools (for next build number)
        run: pip3 install --user --break-system-packages codemagic-cli-tools

      - name: Compute next TestFlight build number
        id: build_num
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export PATH="$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APP_ID" \
            --issuer-id "$ISSUER_ID" \
            --key-id "$KEY_ID" \
            2>/dev/null || echo 0)
          # Fallback if command outputs non-integer
          [[ "$LATEST" =~ ^[0-9]+$ ]] || LATEST=0
          NEXT=$((LATEST + 1))
          echo "TestFlight latest = $LATEST → next = $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Flutter pub get
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Flutter iOS config-only
        run: flutter build ios --config-only --release

      - name: CocoaPods install
        run: |
          cd ios
          pod install --repo-update

      - name: Set manual signing via xcode-project use-profiles
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          export PATH="$(python3 -m site --user-base)/bin:$PATH"
          cd ios
          xcode-project use-profiles

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number=${{ steps.build_num.outputs.next }} \
            --export-options-plist ios/ExportOptions.plist 2>&1 | tee "$RUNNER_TEMP/flutter_build.log"
          echo "=== IPA(s) produced ==="
          ls -la build/ios/ipa/

      - name: Upload to TestFlight via altool
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA=$(ls build/ios/ipa/*.ipa | head -1)
          echo "Uploading: $IPA"
          xcrun altool --upload-app \
            -f "$IPA" \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/flutter_build.log
            /tmp/xcodebuild_logs/
          if-no-files-found: ignore
